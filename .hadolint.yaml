# Hadolint configuration
  failure-threshold: error  # only ERROR or more severe fails the CI

override:
  info:
    - DL3008  # apt-get install version pin
- DL3013  # pip install version pin
    - SC1091  # ShellCheck: "Not following: ..." (source)

# Trusted registries
trustedRegistries:
  - docker.io
  - registry.hub.docker.com