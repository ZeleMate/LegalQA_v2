name: Local CI

# This repo's own CI jobs. The template wrote this file once and never updates it.
# ci.yml calls it on every PR and push, and the merge gate (ci-ok) waits for it.
# Moved here from the old "CI/CD Pipeline" workflow when the repo adopted the template.
#
# Rules: no job may need a secret (Dependabot PRs get none), every action is pinned
# to a full commit SHA, and each job asks for read access only.
on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: lint (black, isort, flake8, mypy, bandit, hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .[dev]
      - run: black --check src/ tests/
      - run: isort --check-only src/ tests/
      - run: flake8 src/ tests/
      - run: mypy src/
      - run: bandit -r src/
      - name: Hadolint (Dockerfiles, checksum-verified)
        env:
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          git ls-files -z | grep -zE '(^|/)Dockerfile(\..*)?$' | xargs -0 --no-run-if-empty -n1 "$RUNNER_TEMP/hadolint" --failure-threshold error

  test:
    name: pytest (coverage ≥ 25%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .[dev]
      - run: pytest --maxfail=1 --disable-warnings --tb=short --cov=src --cov-report=xml --cov-fail-under=25

  docker-build:
    name: docker build (Dockerfile.minimal)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.minimal
          tags: legalqa:ci
          load: true
          no-cache: true
          platforms: linux/amd64
          push: false
